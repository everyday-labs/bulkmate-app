name: CodeQL

# Static security analysis of the TypeScript/JavaScript (mobile app + Edge
# Functions). Findings appear under Security → Code scanning, and on PRs.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1' # weekly, Monday 06:27 UTC — catches new queries
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/__tests__/**'
              - costco-mobile/e2e
              - costco-mobile/test-utils
              - costco-backend/supabase/functions/_testing
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript

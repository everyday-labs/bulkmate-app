name: OpenSSF Scorecard

# Weekly supply-chain security posture check (branch protection, pinned
# dependencies, token permissions, SAST, etc.). Results go to Security → Code
# scanning; the score is published to scorecard.dev.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '41 7 * * 1' # weekly, Monday 07:41 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile:
    name: Mobile (typecheck, contrast, Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: costco-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: costco-mobile/package-lock.json
      - run: npm ci --legacy-peer-deps   # same as local installs (see CLAUDE.md)
      - run: npx tsc --noEmit
      - run: npm run check:contrast
      - run: npm test -- --ci

  backend:
    name: Edge Functions (deno check, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: costco-backend/supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check .
      - run: deno lint
      - run: deno test --allow-env

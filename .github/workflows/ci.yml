name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repo.
permissions:
  contents: read

env:
  # Git hooks are a local-dev gate; CI runs the same checks explicitly.
  HUSKY: 0
  NODE_VERSION: 22

# Third-party actions are pinned to full commit SHAs (tag in the comment);
# Dependabot (.github/dependabot.yml) keeps them current.

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: costco-mobile/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Install
        working-directory: costco-mobile
        run: npm ci --legacy-peer-deps # same as local installs (see CLAUDE.md)
      - name: Prettier (all tracked files)
        run: git ls-files -z | xargs -0 costco-mobile/node_modules/.bin/prettier --check --ignore-unknown
      - name: ESLint
        working-directory: costco-mobile
        run: npm run lint
      - name: TypeScript
        working-directory: costco-mobile
        run: npm run typecheck
      - name: WCAG contrast
        working-directory: costco-mobile
        run: npm run check:contrast
      - name: Deno check & lint (Edge Functions)
        working-directory: costco-backend/supabase/functions
        run: |
          deno check .
          deno lint

  mobile-tests:
    name: Mobile tests (Jest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: costco-mobile/package-lock.json
      - name: Install
        working-directory: costco-mobile
        run: npm ci --legacy-peer-deps
      - name: Jest (fails below the coverageThreshold in package.json)
        working-directory: costco-mobile
        run: npm run test:coverage -- --ci --silent
      - name: Coverage summary
        if: always()
        working-directory: costco-mobile
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Mobile coverage", "| Metric | % | Covered |", "|---|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-coverage
          path: costco-mobile/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  backend-tests:
    name: Edge Function tests (Deno + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Tests + coverage gate (scripts/deno-coverage.sh, min 90% lines)
        run: |
          set -o pipefail
          ./scripts/deno-coverage.sh | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage.txt ] || exit 0
          { echo '### Edge Function coverage'; echo '```'; sed 's/\x1b\[[0-9;]*m//g' coverage.txt | awk '/^\| File/{n++} n==2'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: .cov/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  visual:
    name: Visual regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pinned browser + fonts so screenshots are stable between runs.
    # Keep the tag in step with @playwright/test in costco-mobile/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: costco-mobile/package-lock.json
      - name: Install
        working-directory: costco-mobile
        run: npm ci --legacy-peer-deps
      - name: Build web
        working-directory: costco-mobile
        run: npm run build:web
      - name: Screenshot tests
        working-directory: costco-mobile
        # Compares against committed baselines; writes any that are missing.
        run: npx playwright test --update-snapshots=missing
      - name: Fail on new, uncommitted baselines
        working-directory: costco-mobile
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          new=$(git status --porcelain --untracked-files=all e2e/__screenshots__)
          if [ -n "$new" ]; then
            echo "$new"
            echo "::error::New visual baselines were generated. Download the 'visual-baselines' artifact, review the images, and commit them under costco-mobile/e2e/__screenshots__/."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-baselines
          path: costco-mobile/e2e/__screenshots__/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: costco-mobile/playwright-report/
          retention-days: 7

  # Single status to require in branch protection.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, mobile-tests, backend-tests, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

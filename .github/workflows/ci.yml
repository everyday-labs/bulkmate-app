name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repo.
permissions:
  contents: read

env:
  # Git hooks are a local-dev gate; CI runs the same checks explicitly.
  HUSKY: 0
  NODE_VERSION: 22
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: 1.30.1

# Third-party actions are pinned to full commit SHAs (tag in the comment) and
# downloaded tools to a version + SHA-256; Dependabot keeps the actions current.
# Every checkout drops its token (persist-credentials: false) so nothing later
# in a job — artifacts included — can carry it out.

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit on every branch, not just the tip
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tar.gz
      - name: Scan full history (.gitleaks.toml, known findings in .gitleaksignore)
        run: ./scripts/secret-scan.sh

  workflow-lint:
    name: Workflow & shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint && sudo mv actionlint /usr/local/bin/ && rm actionlint.tar.gz
      - name: actionlint (workflow syntax, expressions, embedded shellcheck)
        run: actionlint
      - name: zizmor (GitHub Actions security audit)
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --format=github --min-severity=low .github/workflows
      - name: shellcheck (scripts and git hooks)
        run: shellcheck scripts/*.sh && shellcheck --shell=sh costco-mobile/.husky/pre-commit costco-mobile/.husky/pre-push

  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: costco-mobile/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Install
        working-directory: costco-mobile
        run: npm ci --legacy-peer-deps # same as local installs (see CLAUDE.md)
      - name: Prettier (all tracked files)
        run: git ls-files -z | xargs -0 costco-mobile/node_modules/.bin/prettier --check --ignore-unknown
      - name: ESLint
        working-directory: costco-mobile
        run: npm run lint
      - name: TypeScript
        working-directory: costco-mobile
        run: npm run typecheck
      - name: WCAG contrast
        working-directory: costco-mobile
        run: npm run check:contrast
      - name: Deno check & lint (Edge Functions)
        working-directory: costco-backend/supabase/functions
        run: |
          deno check .
          deno lint

  dependencies:
    name: Dependency review & audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block new vulnerable or copyleft dependencies (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          comment-summary-in-pr: never
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit — existing vulnerabilities (reported, not blocking)
        working-directory: costco-mobile
        # Existing issues sit in Expo SDK 54's build tooling and need an SDK
        # upgrade; dependency review above blocks anything new.
        run: |
          npm audit --omit=dev --json > audit.json || true
          # shellcheck disable=SC2016 # ${...} is a JavaScript template literal
          node -e '
            const m = require("./audit.json").metadata.vulnerabilities;
            console.log(["### npm audit (production deps)", "| critical | high | moderate | low |", "|---|---|---|---|",
              `| ${m.critical} | ${m.high} | ${m.moderate} | ${m.low} |`].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

  mobile-tests:
    name: Mobile tests (Jest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: costco-mobile/package-lock.json
      - name: Install
        working-directory: costco-mobile
        run: npm ci --legacy-peer-deps
      - name: Jest (fails below the coverageThreshold in package.json)
        working-directory: costco-mobile
        run: npm run test:coverage -- --ci --silent
      - name: Coverage summary
        if: always()
        working-directory: costco-mobile
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          # shellcheck disable=SC2016 # ${...} is a JavaScript template literal
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Mobile coverage", "| Metric | % | Covered |", "|---|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobile-coverage
          path: costco-mobile/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  backend-tests:
    name: Edge Function tests (Deno + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Tests + coverage gate (scripts/deno-coverage.sh, min 90% lines)
        run: |
          set -o pipefail
          ./scripts/deno-coverage.sh | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage.txt ] || exit 0
          { echo '### Edge Function coverage'; echo '```'; sed 's/\x1b\[[0-9;]*m//g' coverage.txt | awk '/^\| File/{n++} n==2'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: .cov/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  visual:
    name: Visual regression (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pinned browser + fonts so screenshots are stable between runs.
    # Keep the tag in step with @playwright/test in costco-mobile/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: costco-mobile/package-lock.json
      - name: Install
        working-directory: costco-mobile
        run: npm ci --legacy-peer-deps
      - name: Build web
        working-directory: costco-mobile
        run: npm run build:web
      - name: Screenshot tests
        working-directory: costco-mobile
        # Compares against committed baselines; writes any that are missing.
        run: npx playwright test --update-snapshots=missing
      - name: Fail on new, uncommitted baselines
        working-directory: costco-mobile
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          new=$(git status --porcelain --untracked-files=all e2e/__screenshots__)
          if [ -n "$new" ]; then
            echo "$new"
            echo "::error::New visual baselines were generated. Download the 'visual-baselines' artifact, review the images, and commit them under costco-mobile/e2e/__screenshots__/."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-baselines
          path: costco-mobile/e2e/__screenshots__/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: costco-mobile/playwright-report/
          retention-days: 7

  # Single status required by branch protection on main.
  ci-passed:
    name: CI passed
    if: always()
    needs: [secrets, workflow-lint, lint, dependencies, mobile-tests, backend-tests, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
